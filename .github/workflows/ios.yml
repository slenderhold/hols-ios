name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Hols.xcodeproj -scheme Hols -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hols.app Payload/
          zip -qry Hols-unsigned.ipa Payload
          ls -la Hols-unsigned.ipa

      - name: Signed IPA (only when the Apple certificate secrets are set)
        if: ${{ env.P12_BASE64 != '' }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; security create-keychain -p ci "$KC"; security set-keychain-settings "$KC"; security unlock-keychain -p ci "$KC"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KC" login.keychain; security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/hols.mobileprovision
          xcodebuild -project Hols.xcodeproj -scheme Hols -configuration Release -sdk iphoneos -archivePath build/Hols.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual archive | tail -20
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>ad-hoc</string><key>teamID</key><string>$TEAM_ID</string></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/Hols.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
          cp build/ipa/*.ipa Hols-signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Hols-iOS
          path: Hols-*.ipa

      - name: Publish to the «builds» branch and a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=build-${{ github.run_number }}
          gh release create "$TAG" Hols-*.ipa --title "Hols iOS ${{ github.run_number }}" --notes "Сборка ${{ github.sha }}" || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p /tmp/out && cp Hols-*.ipa /tmp/out/
          git checkout --orphan builds && git rm -rqf . && cp /tmp/out/*.ipa . && git add *.ipa
          git commit -qm "IPA $TAG" && git push -f origin builds
